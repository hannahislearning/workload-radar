u002Fdiv>\n<div class=\"mu\" style=\"margin:8px 0 12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center\"><span>Key:<\u002Fspan><span><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#8fc48a;vertical-align:-2px\"><\u002Fspan> Light, up to 4h<\u002Fspan><span><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#e6cd6a;vertical-align:-2px\"><\u002Fspan> Busy, 5 to 7h<\u002Fspan><span><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#e8a161;vertical-align:-2px\"><\u002Fspan> Full, 8h<\u002Fspan><span><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#d9675c;vertical-align:-2px\"><\u002Fspan> Over, 9h or more<\u002Fspan><span>Dashed outline: waiting for approval<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:14px;align-items:flex-start\">\n<div class=\"cd\" style=\"flex:1.2\">\n<sc-if value=\"{{isMgr}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-weight:500\">Move work to someone else<\u002Fdiv>\n<sc-if value=\"{{noFlip}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"mu\" style=\"margin-top:6px\">Click a box above, then pick a task to move.<\u002Fdiv><\u002Fsc-if>\n<sc-for list=\"{{cellTasks}}\" as=\"t\" hint-placeholder-count=\"0\"><div class=\"rw\"><span>{{t.label}}<\u002Fspan><button class=\"bt\" sc-camel-on-click=\"{{t.pick}}\">Move<\u002Fbutton><\u002Fdiv><\u002Fsc-for>\n<sc-if value=\"{{hasRt}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:10px;font-weight:500\">Move \"{{rtName}}\" to:<\u002Fdiv>\n<sc-for list=\"{{targets}}\" as=\"g\" hint-placeholder-count=\"0\"><div class=\"rw\"><span>{{g.label}}<\u002Fspan><button class=\"bt pr\" sc-camel-on-click=\"{{g.pick}}\">Ask {{g.name}}<\u002Fbutton><\u002Fdiv><\u002Fsc-for><\u002Fsc-if>\n<\u002Fsc-if>\n<sc-if value=\"{{isMem}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-weight:500\">My tasks, most urgent first<
